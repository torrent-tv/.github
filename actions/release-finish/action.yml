name: Finish release
description: >-
  Pushes the release tag and the release commit, then creates the GitHub release.
  Both steps are skipped when already done, so a re-run of a published release
  changes nothing.
  Runs after publishing, so a failed publication leaves nothing behind in git.
  When main moved while the job ran, the release commit is merged into it instead
  of being rebased, so the tag stays on the commit that was published. The merge keeps
  main's files and takes the version and the released changelog section from the
  release, so entries of commits pushed meanwhile stay under "## Unreleased".
inputs:
  tag:
    required: true
  changelog:
    description: The changelog the release wrote, as given to release-prepare.
    required: true
  version-files:
    description: The version files, as given to release-prepare.
    required: true
  notes-file:
    required: true
  github-token:
    required: true
runs:
  using: composite
  steps:
    - name: Push the tag and the release commit
      shell: bash
      env:
        SCRIPTS: ${{ github.action_path }}/../../scripts
        TAG: ${{ inputs.tag }}
        CHANGELOG: ${{ inputs.changelog }}
        FILES: ${{ inputs.version-files }}
      run: |
        if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
          echo "$TAG is already on the remote; nothing to push"
          exit 0
        fi
        git push origin "refs/tags/$TAG"
        for attempt in 1 2 3; do
          if git push origin HEAD:refs/heads/main; then exit 0; fi
          echo "main moved during the release (attempt $attempt); merging the release into it"
          git fetch -q origin main
          git checkout -q --detach FETCH_HEAD
          node "$SCRIPTS/merge-release.mjs" --release "refs/tags/$TAG" --changelog "$CHANGELOG" --version-files "$FILES"
        done
        exit 1

    - name: Create the GitHub release
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        TAG: ${{ inputs.tag }}
        NOTES: ${{ inputs.notes-file }}
      run: |
        if gh release view "$TAG" >/dev/null 2>&1; then
          echo "the GitHub release $TAG exists"
        else
          gh release create "$TAG" --title "$TAG" --notes-file "$NOTES" --verify-tag
        fi
