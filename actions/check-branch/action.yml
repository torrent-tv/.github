name: Branch name names a task
description: >-
  A pushed branch or a pull request's branch is `main` or names a task as
  `<type>/ttv-<issue>-<description>`.
runs:
  using: composite
  steps:
    - name: Branch name names a task
      shell: bash
      env:
        EVENT: ${{ github.event_name }}
        HEAD_REF: ${{ github.head_ref }}
        REF_NAME: ${{ github.ref_name }}
        REF_TYPE: ${{ github.ref_type }}
        DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        SCRIPTS: ${{ github.action_path }}/../../scripts
      run: |
        case "$EVENT" in
          pull_request) branch="$HEAD_REF" ;;
          push) [ "$REF_TYPE" = branch ] || { echo "No branch to check for a $REF_TYPE push"; exit 0; }; branch="$REF_NAME" ;;
          *) echo "No branch to check for a $EVENT event"; exit 0 ;;
        esac
        node "$SCRIPTS/check-branch.mjs" --branch "$branch" --default "${DEFAULT_BRANCH:-main}"
