name: Defect
description: Something behaves differently from what it should.
labels: ["bug"]
projects: ["torrent-tv/1"]
body:
  - type: textarea
    id: observed
    attributes:
      label: Observed
      description: What happened, with versions, time and the relevant log lines from both sides.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected
    validations:
      required: true
  - type: textarea
    id: cause
    attributes:
      label: Cause
      description: The established cause, or what is still needed to establish it.
